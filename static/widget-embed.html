<!DOCTYPE html>
<html>
<head>
	<title>Open WebUI Widget Embed</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
		}

		.open-webui-modal-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.5);
			backdrop-filter: blur(4px);
			z-index: 9998;
			display: none;
			animation: fadeIn 0.2s ease;
		}

		.open-webui-modal-overlay.open {
			display: block;
		}

		.open-webui-widget {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 90%;
			max-width: 1200px;
			height: 90%;
			max-height: 800px;
			border: none;
			border-radius: 16px;
			box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
			z-index: 9999;
			display: none;
			animation: slideUp 0.3s ease;
		}

		.open-webui-widget.open {
			display: block;
		}

		.open-webui-launcher {
			position: fixed;
			bottom: 24px;
			right: 24px;
			width: 64px;
			height: 64px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border: none;
			border-radius: 50%;
			color: white;
			font-size: 28px;
			cursor: pointer;
			box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
			z-index: 10000;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.3s ease;
		}

		.open-webui-launcher:hover {
			transform: scale(1.1);
			box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
		}

		.open-webui-launcher:active {
			transform: scale(0.95);
		}

		@keyframes fadeIn {
			from { opacity: 0; }
			to { opacity: 1; }
		}

		@keyframes slideUp {
			from {
				opacity: 0;
				transform: translate(-50%, -45%);
			}
			to {
				opacity: 1;
				transform: translate(-50%, -50%);
			}
		}
	</style>
</head>
<body>
	<button id="open-webui-launcher" class="open-webui-launcher" title="Talk to Data">
		💬
	</button>
	<div id="open-webui-overlay" class="open-webui-modal-overlay"></div>
	<iframe id="open-webui-widget" class="open-webui-widget"></iframe>

	<script>
		class OpenWebUIWidget {
			constructor(config = {}) {
				this.config = {
					src: config.src || 'http://localhost:5173/widget',
					token: config.token || '',
					theme: config.theme || 'system',
					title: config.title || 'Talk to Data',
					// Data to pass to widget
					fileId: config.fileId || '',
					fileName: config.fileName || '',
					context: config.context || '',
					...config
				};

				this.iframe = document.getElementById('open-webui-widget');
				this.overlay = document.getElementById('open-webui-overlay');
				this.launcher = document.getElementById('open-webui-launcher');
				this.isOpen = false;
				this.isReady = false;

				this.init();
			}

			init() {
				// Set iframe source with parameters
				const params = new URLSearchParams({
					theme: this.config.theme,
					title: this.config.title,
					position: 'fullscreen'
				});

				if (this.config.token) {
					params.set('token', this.config.token);
				}

				// Add data parameters
				if (this.config.fileId) {
					params.set('fileId', this.config.fileId);
				}
				if (this.config.fileName) {
					params.set('fileName', this.config.fileName);
				}

				this.iframe.src = `${this.config.src}?${params.toString()}`;

				// Add event listeners
				this.launcher.addEventListener('click', () => this.toggle());
				this.overlay.addEventListener('click', () => this.close());
				window.addEventListener('message', (e) => this.handleMessage(e));
				
				// Handle ESC key
				document.addEventListener('keydown', (e) => {
					if (e.key === 'Escape' && this.isOpen) {
						this.close();
					}
				});
			}

			handleMessage(event) {
				if (event.data?.origin !== 'open-webui-widget') return;

				switch (event.data.type) {
					case 'open-webui-widget-ready':
						console.log('✅ Open WebUI Widget ready');
						this.isReady = true;
						// Send initial data to widget
						this.sendData({
							fileId: this.config.fileId,
							fileName: this.config.fileName,
							context: this.config.context
						});
						break;
					
					case 'widget-close-request':
						this.close();
						break;

					case 'widget-closed':
						console.log('Widget closed');
						break;
				}
			}

			toggle() {
				if (this.isOpen) {
					this.close();
				} else {
					this.open();
				}
			}

			open() {
				this.isOpen = true;
				this.iframe.classList.add('open');
				this.overlay.classList.add('open');
				this.launcher.style.display = 'none';
				document.body.style.overflow = 'hidden';
			}

			close() {
				this.isOpen = false;
				this.iframe.classList.remove('open');
				this.overlay.classList.remove('open');
				this.launcher.style.display = 'flex';
				document.body.style.overflow = '';
				
				// Notify widget about close
				if (this.isReady) {
					this.sendMessage('widget-close');
				}
			}

			// Public method to update data dynamically
			sendData(data) {
				this.sendMessage('widget-set-data', data);
			}

			sendMessage(type, data) {
				if (this.iframe.contentWindow) {
					this.iframe.contentWindow.postMessage({
						type,
						data,
						origin: 'parent-app'
					}, '*');
				}
			}

			// Public methods for external control
			updateFileId(fileId, fileName = '') {
				this.config.fileId = fileId;
				this.config.fileName = fileName;
				this.sendData({ fileId, fileName });
			}

			setContext(context) {
				this.config.context = context;
				this.sendData({ context });
			}
		}

		// Auto-initialize if config is provided
		if (window.openWebUIConfig) {
			window.openWebUIWidget = new OpenWebUIWidget(window.openWebUIConfig);
		}

		// Export for manual initialization
		window.OpenWebUIWidget = OpenWebUIWidget;
	</script>
</body>
</html>
